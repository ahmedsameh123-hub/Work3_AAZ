<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even Only</title>
</head>

<body>
    <script>
        function evenOnly(arr) {
            return arr.filter(num => num % 2 === 0);
        }

        const arr = [10, 2, 3, 5, 2];
        document.write("Even numbers: " + evenOnly(arr).join(', ')); // Output: [10, 2, 2]
    </script>
</body>

</html>
