<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game</title>
</head>

<body>
    <button onclick="guessingGame()">Start Guessing Game</button>

    <script>
        function guessingGame() {
            const randomNumber = Math.floor(Math.random() * 11);
            let guess;
            do {
                guess = parseInt(prompt("Guess the number between 0 and 10:"));
                if (guess === randomNumber) {
                    alert("Good Guess");
                } else {
                    alert("Try Again");
                }
            } while (guess !== randomNumber);
        }
    </script>
</body>

</html>
