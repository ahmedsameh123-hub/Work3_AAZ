<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Search</title>
</head>

<body>
    <script>
        function numberSearch(arr, num) {
            const indexes = [];
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] === num) {
                    indexes.push(i);
                }
            }
            return indexes;
        }

        const arr = [10, 2, 3, 5, 2];
        const num = 2;
        document.write("Indexes: " + numberSearch(arr, num).join(', ')); // Output: [1, 4]
    </script>
</body>

</html>
