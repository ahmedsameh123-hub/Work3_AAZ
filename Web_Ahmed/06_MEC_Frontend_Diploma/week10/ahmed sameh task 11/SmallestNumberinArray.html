<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smallest Number in Array</title>
</head>

<body>
    <script>
        function smallestNumber(arr) {
            return Math.min(...arr);
        }

        const arr = [10, 2, 3, 5, 2];
        document.write("Smallest number: " + smallestNumber(arr)); // Output: 2
    </script>
</body>

</html>
