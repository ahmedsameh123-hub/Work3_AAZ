<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle Pattern</title>
</head>

<body>
    <h1>Triangle Pattern</h1>
    <div>
        <label for="height">Enter the height of the pyramid:</label>
        <input type="number" id="height" min="1" placeholder="Height">
        <button onclick="generateTriangle()">Generate Triangle</button>
    </div>
    <pre id="triangle"></pre>

    <script>
        function generateTriangle() {
            const height = document.getElementById("height").value;
            const triangleContainer = document.getElementById("triangle");
            let trianglePattern = "";

            for (let i = 1; i <= height; i++) {
                trianglePattern += "* ".repeat(i) + "\n";
            }

            triangleContainer.textContent = trianglePattern;
        }
    </script>
</body>

</html>
