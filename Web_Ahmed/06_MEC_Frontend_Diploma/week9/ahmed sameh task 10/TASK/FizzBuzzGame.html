<!DOCTYPE html>
<html>

<head>
    <title>Fizz Buzz Game</title>
</head>

<body>
    <script>
        var number = parseInt(prompt("Enter a number:"));

        if (number % 3 === 0 && number % 5 === 0) {
            document.write("FizzBuzz");
        } else if (number % 3 === 0) {
            document.write("Fizz");
        } else if (number % 5 === 0) {
            document.write("Buzz");
        } else {
            document.write(number);
        }

        var start = parseInt(prompt("Enter the start number:"));
        var end = parseInt(prompt("Enter the end number:"));

        for (var i = start; i <= end; i++) {
            if (i % 3 === 0 && i % 5 === 0) {
                document.write("FizzBuzz ");
            } else if (i % 3 === 0) {
                document.write("Fizz ");
            } else if (i % 5 === 0) {
                document.write("Buzz ");
            } else {
                document.write(i + " ");
            }
        }
    </script>
</body>

</html>
